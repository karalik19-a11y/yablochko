name: Screenshots

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start API + SPA server
        run: |
          npm run dev:api &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/v1/meta/status > /dev/null; then
              echo "server up"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/v1/meta/status > /dev/null

      - name: Screenshot tests (key screens, themes, Ctrl+K)
        run: node scripts/screenshots.mjs

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
