[package]
name = "yabloko-intelligence"
version = "0.2.0"
description = "YABLOKO INTELLIGENCE — аналитическая платформа партии «ЯБЛОКО»"
authors = ["YABLOKO INTELLIGENCE"]
edition = "2021"
rust-version = "1.77"

# Rust-ядро desktop-профиля (ROADMAP «core-rs»): IPC-роутер, rusqlite.
# DuckDB в ядре отложен (ADR-0007): аналитика shredded-профиля покрывается
# SQLite-кэшем ответов, собираемым на этапе build (scripts/build-desktop-resources.ts).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
